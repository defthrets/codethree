; ===========================================================================
;  Code Three  -  paramedics who actually do something, for GTA V
; ===========================================================================
;
;  This file is NEVER overwritten by an update. That is deliberate -- it is the
;  file you hand-edit. When a new version adds a setting, the deploy adds the missing
;  lines with their comments and leaves everything you have changed exactly as it is.
;
;  Every value here is the default. Deleting a line is the same as leaving it, and
;  deleting the whole file is safe -- the mod runs on the values built into it.
;
;  Times are in milliseconds. Distances are in metres.

[General]
Enabled = true

; Error, Warn, Info or Debug. Debug is loud; it names every sweep and every attach.
Logging = Info

; THE SETTINGS SCREEN. Everything in this file is on it, and the [Fit] rows at the
; bottom are the reason it exists -- those you aim by looking at the thing move.
;
; SHIFT+H, AND NOT A FUNCTION KEY. This shipped on F9 first and F9 was taken. Nothing
; in the scripts folder claims F9 in a config file even now, so whatever owns it is
; hardcoded in another mod's dll, an ASI with no ini, or something outside the game --
; ShadowPlay, Afterburner, Steam and Discord all default to keys in that row.
;
; Which means a scan cannot clear F7 or F8 either, and the rest of the row is gone:
; F1 FranklinRP, F2 Hoodrich, F3 Street Golf, F5 Vehicle Tweaks, F6 Weapon Tweaks,
; F10 Five0 Patrol, F11 and F12 Bare Minimum. F4 is ScriptHookVDotNet's console.
;
; So this sits with Bloody Mess (Shift+B) and Fumes (Shift+F) instead. H is claimed by
; nothing in the folder, bare or chorded -- which matters, because a mod bound to a
; BARE key that ignores modifiers will also fire on Shift plus that key.
;
; MenuModifier is Shift, Control, Alt, or None for a bare key. The modifier must match
; EXACTLY -- Ctrl+Shift+H is somebody else's chord and will not open this.
MenuKey = H
MenuModifier = Shift

; OFF BY DEFAULT. Everything this mod does is a thing you watch happen in a street,
; and a ticker narrating it is the mod telling you about a scene instead of letting
; you look at it. The switch stays because a player who cannot yet tell whether the
; mod is running wants it -- but it is a diagnostic now, not part of the show.
Announce = false

; TURN OFF THE GAME'S OWN AMBULANCES.
;
; GTA V dispatches one of its own to a body, and it is the thing this mod exists to
; replace -- it arrives, the crew stand over him, and they drive away leaving him in
; the road. Left on, a bad kill can produce two ambulances at one junction: ours
; working on him and the game's parked behind it doing nothing.
;
; Switched back on automatically when the mod unloads, so this can never leave you
; with a city that has no ambulances at all.
;
; Set false if you run something else that wants the vanilla crews.
SuppressVanillaAmbulances = true


[Crew]
; WHETHER A WORKABLE DEATH IS EVER ACTUALLY WORKED.
;
; Off, they always lose him and he always goes in the back. That is a colder mod and
; a defensible one.
;
; WHICH deaths are workable is not a setting, because it is not an opinion. It is read
; off the engine's own record of what killed him: fists, a bat, a knife, a taser -- the
; things somebody comes back from -- against guns, cars, fire, explosions and long
; drops, which are the things nobody does.
Resuscitate = true

; And whether the ones they lose are loaded onto the trolley and driven to the nearest
; hospital, or simply left where they are as the vanilla crews leave them.
;
; Worth turning off if another mod wants the corpse where it fell -- this is the half
; of Code Three that moves other people's bodies.
TakeToHospital = true

; The second man carries the bag over and sets it down beside him. The red one from
; the back of every ambulance -- prop_med_bag_01 -- which the game already has.
MedicBag = true

; WHEN THEY LOSE HIM, THE SECOND MAN STANDS AND WRITES IT DOWN. The vanilla
; paramedic's own time-of-death scenario, clipboard and all. It is the beat that says
; the scene is over before anybody reaches for the trolley, and the one most worth
; keeping if the rest is turned off.
TimeOfDeath = true

; A man they bring round limps away rather than strolling. It is a movement clipset,
; so it is how he walks from then on -- he was beaten unconscious a minute ago, and a
; brisk walk off reads as the mod having lost interest in him.
InjuredWalk = true


[Range]
; How far out a death is noticed. The sweep runs over this about every three-quarters
; of a second, so it is a real cost rather than a free number. Sixty metres is most of
; a block.
NoticeRange = 60

; How far off the van is put out, and how much that varies. Far enough to be a drive,
; near enough to arrive.
ComeFrom = 110
ComeSpread = 70

; Close enough to the body to count as arrived, and close enough to kneel at it.
ThereRange = 24
KneelRange = 2.6

; Past this the whole thing is handed back to the game. A call-out you have driven
; three streets away from is not worth holding a van, two crew and a trolley for.
LetGoRange = 320

; How near a scene has to be to count as the one they are already at. This is also the
; answer Five0 Patrol gets when it asks whether its officers should still be waiting.
SameScene = 70

; How near you have to be for the mod to say anything at all.
TellRange = 60

; And close enough to the hospital to call it arrived and let everything go.
ArrivedRange = 40

; How fast it drives, in game units. Lights and siren on the way in.
Speed = 22


[Timing]
; How long it may spend getting there before the call-out is written off. A van that
; cannot find the street is worse than no van.
ComeMs = 100000

; How long the crew are given to walk from the van to the body.
ReachMs = 12000

; HOW LONG THE COMPRESSIONS LAST, for somebody with a chance against somebody without.
; A man with a chance gets two rounds with WorkMs split between them; a man without
; gets one round of CheckMs. Everything around the compressions -- kneeling, the look,
; leaning in, sitting back -- is the game's own clips playing to their own ends, and
; is not timed from here at all.
;
; These two being DIFFERENT is most of what makes the scene read: vanilla gives both
; the same twenty-six seconds of standing about.
WorkMs = 17000
CheckMs = 8000

; The beat on the last frame of it -- him sat up, or the medic sat back -- before
; anybody moves.
VerdictMs = 2600

; A ceiling on the helping-him-to-his-feet scene. It normally ends on its own clip.
RisingMs = 6000

; How long the second man spends on the clipboard before the trolley comes out.
PronounceMs = 6000

; Getting the trolley out beside him, and him onto it.
FetchMs = 3200
LoadMs = 2800

; Wheeling him back to the van, and getting him into the back with everybody aboard.
WheelMs = 14000
StowMs = 6000

; How long the van waits for its crew before it goes without them. A van that pulls
; away the instant the clock runs out leaves a paramedic stood in the road for the
; rest of the session.
BoardMs = 9000

; And the longest the drive to the hospital is ever held for before it is let go.
GoneMs = 180000


[Fit]
; WHERE THINGS SIT, AND WHY THESE ARE HERE AT ALL.
;
; A prop's origin is wherever the artist put it, and there is no way to measure one
; from outside the running game. Every number below is a considered starting point
; rather than a measurement. If the body floats a hand's width above the canvas, or
; sinks into it, or the trolley rides too low in front of the man pushing it -- nudge
; it. That is what these are for, and it beats a magic constant in a source file
; nobody dares touch.
;
; TUNE THESE ON THE F9 SCREEN RATHER THAN IN HERE. They are the one part of this mod
; you aim by LOOKING at it, and the menu re-attaches the body on the frame you move
; the number -- so you hold Right while watching him settle onto the canvas. Editing
; this file means alt-tab, Insert, kill somebody with a gun, wait for the van, watch
; the load, and start again. The menu writes your answer back here when you close it.
;
; X is left and right, Y is forward and back, Z is up and down. Metres, relative to
; whatever the thing is attached to. Yaw is degrees.
;
; THE HEIGHTS ARE MEASURED NOW AND THESE ARE NUDGES ON TOP. GET_MODEL_DIMENSIONS
; gives the trolley's bounding box, which says exactly where its origin sits inside
; it -- so the mod already knows how far to lift it to stand it on its wheels, and
; how high the canvas is. The Z numbers below are ADDED to that. Zero means "where
; the measurement says", which should be close to right; use these only for the
; amount it is out by. The log prints what it measured.

; The body lying on the trolley.
BodyOnTrolleyX = 0
BodyOnTrolleyY = 0
BodyOnTrolleyZ = 0
BodyOnTrolleyYaw = 90

; The trolley out in front of the medic wheeling it.
TrolleyPushX = 0
TrolleyPushY = 1.1
TrolleyPushZ = 0

; And the trolley in the back of the ambulance.
TrolleyInVanX = 0
TrolleyInVanY = -1.9
TrolleyInVanZ = 0.3

; A body over a shoulder. Only used on an install that has NEITHER gurney prop -- both
; arrived in recent updates, so an older copy of the game may have no trolley at all,
; and the crew carry him rather than the mod giving up.
CarryX = 0
CarryY = 0.15
CarryZ = 0.62
CarryYaw = 0

; And that body laid in the back with no trolley under it.
BodyInVanX = 0
BodyInVanY = -1.9
BodyInVanZ = 0.5
BodyInVanYaw = 90
